<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de administração · Kyoto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

  
  <div class="fundo" aria-hidden="true"></div>

  <header class="topo">
    
    <a class="logo" href="#" aria-label="Kyoto – página inicial">
      <img src="img/logo.png" alt="Kyoto">
    </a>
  </header>

  <main>
    <h1 class="titulo">Cadastro de administração</h1>

    <form class="form" action="#" method="post">

      <div class="linha">
        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Digite seu nome" autocomplete="name" minlength="3" required>
        </div>

        <div class="campo">
          <label for="setor">Setor</label>
          <select id="setor" name="setor" required>
            <option value="" disabled selected>Selecione seu setor</option>
            <option value="Mesa">Mesa</option>
            <option value="caixa">Caixa</option>
            <option value="cozinha">Cozinha</option>
            <option value="administracao">Administração</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="Digite seu e-mail" autocomplete="email" required>
      </div>

      <div class="campo">
        <label for="senha">Senha:</label>
        <div class="senha">
          <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="new-password" minlength="8" required>
          
        </div>
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar senha:</label>
        <div class="senha">
          <input id="confirmar" name="confirmar" type="password" placeholder="Confirme sua senha" autocomplete="new-password" minlength="8" required>
          
        </div>
      </div>

      <button class="btn" type="submit">Cadastrar</button>
    </form>
  </main>

</body>
</html>
