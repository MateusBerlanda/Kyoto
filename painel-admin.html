<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kyoto</title>
    <link rel="stylesheet" href="../css/painel-admin.css">
    <link rel="stylesheet" href="../css/header-admin.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="icon" type="image/png" href="img/logo-reduzida.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Luckiest+Guy&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <img src="../img/logo-kyoto.png" class="logo" alt="Logo da Loja">
    </header>

    <div class="top-adm">
        <h1>Bem-vindo ao Painel Administrativo</h1>
        <p>Edite ou adicione produtos de forma eficiente.</p>

        <div class="btns-top">
            <form action="" class="search-box">
                <input type="text" placeholder="Buscar produtos" class="search-input">
                <svg class="lupa" aria-hidden="true" data-prefix="fal" data-icon="search" role="img"
                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                    class="svg-inline--fa fa-search fa-w-16 fa-7x">
                    <path fill="currentColor"
                        d="M508.5 481.6l-129-129c-2.3-2.3-5.3-3.5-8.5-3.5h-10.3C395 312 416 262.5 416 208 416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c54.5 0 104-21 141.1-55.2V371c0 3.2 1.3 6.2 3.5 8.5l129 129c4.7 4.7 12.3 4.7 17 0l9.9-9.9c4.7-4.7 4.7-12.3 0-17zM208 384c-97.3 0-176-78.7-176-176S110.7 32 208 32s176 78.7 176 176-78.7 176-176 176z"
                        class=""></path>
                </svg>
            </form>

            <button class="btn-novo" id="btn-novo-produto">
                Novo Produto <svg aria-hidden="true" data-prefix="fal" data-icon="plus" role="img"
                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"
                    class="svg-inline--fa fa-plus fa-w-12 fa-7x">
                    <path fill="currentColor"
                        d="M376 232H216V72c0-4.42-3.58-8-8-8h-32c-4.42 0-8 3.58-8 8v160H8c-4.42 0-8 3.58-8 8v32c0 4.42 3.58 8 8 8h160v160c0 4.42 3.58 8 8 8h32c4.42 0 8-3.58 8-8V280h160c4.42 0 8-3.58 8-8v-32c0-4.42-3.58-8-8-8z"
                        class=""></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- PRODUTOS -->

    <div class="produtos">
        <div class="produto">
            <img id="img-produto" src="https://placehold.co/200x150" alt="Imagem do Produto">

            <div class="info-produto">
                <div class="textos-produto">
                    <h2>California Roll</h2>
                </div>

                <div class="btns-produto">
                    <button class="btn-icone" aria-label="Editar produto" id="btn-editar-produto">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
                            <path
                                d="M362.7 19.3L314.3 67.7 444.3 197.7l48.4-48.4c25-25 25-65.5 0-90.5L453.3 19.3c-25-25-65.5-25-90.5 0zm-71 71L58.6 323.5c-10.4 10.4-18 23.3-22.2 37.4L1 481.2C-1.5 489.7 .8 498.8 7 505s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L421.7 220.3 291.7 90.3z" />
                        </svg>
                    </button>

                    <button class="btn-icone" aria-label="Desativar produto">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
                            <path fill="currentColor"
                                d="M256 8C119.033 8 8 119.033 8 256s111.033 248 248 248 248-111.033 248-248S392.967 8 256 8zm141.421 106.579c73.176 73.175 77.05 187.301 15.964 264.865L132.556 98.615c77.588-61.105 191.709-57.193 264.865 15.964zM114.579 397.421c-73.176-73.175-77.05-187.301-15.964-264.865l280.829 280.829c-77.588 61.105-191.709 57.193-264.865-15.964z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-add">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <h2 id="modal-titulo" class="sr-only">Editar produto</h2>

            <button type="button" class="modal-fechar" id="fechar-modal" aria-label="Fechar"><svg
                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512">
                    <path
                        d="M310.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L160 210.7 54.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L114.7 256 9.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 301.3 265.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L205.3 256 310.6 150.6z" />
                </svg></button>

            <form class="modal-form">
                <div class="modal-topo">
                    <label class="foto">
                        <span class="foto-preview" id="foto-preview">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
                                fill="none" stroke="#6b5f57" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5" />
                                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <line x1="19" y1="3" x2="19" y2="9" />
                                <line x1="16" y1="6" x2="22" y2="6" />
                            </svg>
                        </span>
                        <span class="foto-texto">Adicionar Foto</span>
                        <input type="file" id="input-foto" accept="image/*" hidden>
                    </label>

                    <div class="campos">
                        <input type="text" placeholder="Nome do produto">
                        <input type="text" placeholder="Categoria do produto">
                        <input type="text" placeholder="Valor">
                        <input type="text" placeholder="Ingredientes">
                    </div>
                </div>

                <textarea placeholder="Descrição" rows="5"></textarea>

                <div class="btns-modal">
                    <button type="button" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modal-editar">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <h2 id="modal-titulo" class="sr-only">Editar produto</h2>

            <button type="button" class="modal-fechar" id="fechar-modal-editar" aria-label="Fechar"><svg
                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512">
                    <path
                        d="M310.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L160 210.7 54.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L114.7 256 9.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 301.3 265.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L205.3 256 310.6 150.6z" />
                </svg></button>

            <form class="modal-form">
                <div class="modal-topo">
                    <label class="foto">
                        <span class="foto-preview" id="foto-preview">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
                                fill="none" stroke="#6b5f57" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5" />
                                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <line x1="19" y1="3" x2="19" y2="9" />
                                <line x1="16" y1="6" x2="22" y2="6" />
                            </svg>
                        </span>
                        <span class="foto-texto">Editar Foto</span>
                        <input type="file" id="input-foto" accept="image/*" hidden>
                    </label>

                    <div class="campos">
                        <input type="text" placeholder="Nome do produto">
                        <input type="text" placeholder="Categoria do produto">
                        <input type="text" placeholder="Valor">
                        <input type="text" placeholder="Ingredientes">
                    </div>
                </div>

                <textarea placeholder="Descrição" rows="5"></textarea>

                <div class="btns-modal">
                    <button type="submit" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar edições</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
