<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="../css/produto.css">
    <link rel="stylesheet" href="../css/header-admin.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="icon" type="image/png" href="img/logo-reduzida.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Luckiest+Guy&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="produto-container">
        <a href="#" class="voltar"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 1 3 5l4 4" />
            </svg> Voltar ao cardápio</a>
        <section class="produto">
            <div class="produto-esquerda">
                <img src="https://placehold.co/200x200" alt="California Roll" class="produto-imagem">
            </div>
            <div class="produto-direita">
                <h1>California Roll</h1>
                <h2>R$ 34,90</h2>
                <p>
                    <span>Ingredientes:</span>
                    Salmão, pepino e kani, com gergelim por fora.
                </p>
                <p>
                    <span>Serve:</span> 1 pessoa.
                </p>
                <h3>Acompanhamentos</h3>
                <div class="acompanhamentos">
                    <label>
                        <input type="checkbox" checked>
                        Molho shoyu
                    </label>
                    <label>
                        <input type="checkbox">
                        Tarê
                    </label>
                    <label>
                        <input type="checkbox" checked>
                        Hashi (palitos)
                    </label>
                    <label>
                        <input type="checkbox">
                        Wasabi
                    </label>
                </div>
                <textarea placeholder="Digite sua observação"></textarea>
                <div class="quantidade">
                    <button type="button">-</button>
                    <span>1</span>
                    <button type="button">+</button>
                    <button type="button" class="adicionar">
                        <span>Adicionar pedido</span>
                        <span class="valor">R$ 34,90</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
